spring.application.name=greenmap

# db
spring.datasource.url=jdbc:mysql://localhost:3306/greenmap
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# naver news api
naver.api.client-id=${CLIENT_ID}
naver.api.client-secret=${CLIENT_SECRET}
naver.api.base-url=https://openapi.naver.com

# HTTP ?? ?? ?? ??
logging.level.org.apache.coyote.http11=DEBUG
logging.level.org.apache.tomcat=DEBUG

# ?? ?? ??
logging.level.root=INFO

# WebClient ?? ??
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# KAKAO KEY
#kakao.redirect-uri.local=${KAKAO_REDIRECT_LOCAL}
#kakao.redirect-uri.prod=${KAKAO_REDIRECT_PROD}
#
#kakao.key.client-id=${KAKAO_CLIENT_ID}
#kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# JWT ??
# Base64? ???? secret ?
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_MS}

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=none
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id



logging.level.org.springframework=ERROR
logging.level.org.springframework.security=TRACE



