spring.application.name=greenmap

# db
spring.datasource.url=jdbc:mysql://localhost:3306/greenmap
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# naver news api
naver.api.client-id=${CLIENT_ID}
naver.api.client-secret=${CLIENT_SECRET}
naver.api.base-url=https://openapi.naver.com

# HTTP ?? ?? ?? ??
logging.level.org.apache.coyote.http11=DEBUG
logging.level.org.apache.tomcat=DEBUG

# ?? ?? ??
logging.level.root=INFO

# WebClient ?? ??
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG

logging.level.org.springframework.security=DEBUG


# application-template.properties
kakao.redirect-uri.local=${KAKAO_REDIRECT_LOCAL}
kakao.redirect-uri.prod=${KAKAO_REDIRECT_PROD}

kakao.key.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# JWT ??
# Base64? ???? secret ?
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_MS}