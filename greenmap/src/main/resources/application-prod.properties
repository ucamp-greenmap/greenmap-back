spring.application.name=greenmap

# 데이터베이스 설정 (환경변수로 주입)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 프로덕션 환경에서는 SQL 로깅 비활성화
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Naver News API
naver.api.client-id=${CLIENT_ID}
naver.api.client-secret=${CLIENT_SECRET}
naver.api.base-url=https://openapi.naver.com

# 로그 레벨 설정 (프로덕션)
logging.level.root=INFO
logging.level.com.ucamp.greenmap=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# Kakao OAuth
kakao.redirect-uri.local=${KAKAO_REDIRECT_LOCAL}
kakao.redirect-uri.prod=${KAKAO_REDIRECT_PROD}
kakao.key.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# JWT 설정
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_MS}

# Frontend URL
frontend.url=${FRONTEND_URL:https://greenmap-ucamp.netlify.app}

# 서버 포트 (Cloud Run 요구사항)
server.port=8080

# 프로덕션 환경에서 에러 스택트레이스 숨기기
server.error.include-stacktrace=never
server.error.include-message=never
