name: Deploy to GCP VM

on:
    push:
        branches:
            - dev # dev 브랜치에 푸시될 때 자동 배포
    workflow_dispatch: # 수동 배포도 가능하도록 설정

env:
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    VM_INSTANCE: greenmap-server # VM 인스턴스 이름
    VM_ZONE: asia-northeast3-a # VM이 있는 Zone

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 코드 체크아웃
              uses: actions/checkout@v4

            - name: Google Cloud 인증
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Cloud SDK 설정
              uses: google-github-actions/setup-gcloud@v2

            - name: VM에 .env 파일 생성
              run: |
                  gcloud compute ssh ${{ env.VM_INSTANCE }} \
                    --zone=${{ env.VM_ZONE }} \
                    --command="cd ~/greenmap-back/greenmap && cat > .env << 'EOF'
                  DB_URL=${{ secrets.DB_URL }}
                  DB_USERNAME=${{ secrets.DB_USERNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
                  JWT_MS=${{ secrets.JWT_MS }}
                  KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
                  KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
                  KAKAO_REDIRECT_LOCAL=${{ secrets.KAKAO_REDIRECT_LOCAL }}
                  KAKAO_REDIRECT_PROD=${{ secrets.KAKAO_REDIRECT_PROD }}
                  CLIENT_ID=${{ secrets.CLIENT_ID }}
                  CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
                  KEPCO_API_KEY=${{ secrets.KEPCO_API_KEY }}
                  SEOUL_BIKE_API_KEY=${{ secrets.SEOUL_BIKE_API_KEY }}
                  SPRING_PROFILES_ACTIVE=prod
                  EOF
                  chmod 600 .env" \
                    --quiet

            - name: VM에 SSH로 배포 실행
              run: |
                  gcloud compute ssh ${{ env.VM_INSTANCE }} \
                    --zone=${{ env.VM_ZONE }} \
                    --command="cd ~/greenmap-back/greenmap && ./deploy.sh" \
                    --quiet

            - name: 배포 결과 확인
              run: |
                  echo "✅ VM 배포가 완료되었습니다!"
                  VM_IP=$(gcloud compute instances describe ${{ env.VM_INSTANCE }} \
                    --zone=${{ env.VM_ZONE }} \
                    --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
                  echo "🌐 서버 주소: http://${VM_IP}:8080"
                  echo "💡 헬스체크: http://${VM_IP}:8080/actuator/health"
