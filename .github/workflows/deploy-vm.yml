name: Deploy to GCP VM

on:
    push:
        branches:
            - dev
    workflow_dispatch:

env:
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    VM_INSTANCE: greenmap-server
    VM_ZONE: asia-northeast3-a

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 코드 체크아웃
              uses: actions/checkout@v4

            - name: Google Cloud 인증
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Cloud SDK 설정
              uses: google-github-actions/setup-gcloud@v2

            - name: VM에 SSH로 배포 실행
              run: |
                  gcloud compute ssh cebu13@${{ env.VM_INSTANCE }} \
                    --zone=${{ env.VM_ZONE }} \
                    --command="cd ~/greenmap-back/greenmap && chmod +x deploy.sh && ./deploy.sh" \
                    --quiet

            - name: 배포 결과 확인
              run: |
                  echo "✅ VM 배포가 완료되었습니다!"
                  VM_IP=$(gcloud compute instances describe ${{ env.VM_INSTANCE }} \
                    --zone=${{ env.VM_ZONE }} \
                    --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
                  echo "🌐 서버 주소: http://${VM_IP}:8080"
                  echo "💡 헬스체크: http://${VM_IP}:8080/actuator/health"
